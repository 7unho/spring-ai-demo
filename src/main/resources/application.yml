spring:
  application:
    name: spring-ai-demo
  ai:
    openai:
        api-key: ${OPENAI_API_KEY}
        chat:
          model: gpt-4o-mini
          max-tokens: 500
logging:
  level:
    com.april2nd.springaidemo: DEBUG

jev:
  enabled: ${JEV_ENABLED:false}
  api-key: ${TYPESAFE_API_KEY:}
  base-url: https://api.typesafe.ai
  model: jev-1.13.0